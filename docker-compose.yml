# `docker compose up` gives you the full platform: core, console, trace store.
# Cloud is a deployment target, not a requirement (concept principle 5).
#
#   docker compose up          → console on http://localhost:5005
#   docker compose --profile split up
#                              → same, but the worker runs as its own process
#
# Agent and tool definitions are bind-mounted from the checkout, so editing a
# file on the host is picked up immediately and `git diff` still tells the truth.

services:
  heddled:
    build: .
    image: heddled:latest
    # PID 1 would otherwise be Python, which neither forwards SIGTERM to the
    # worker threads nor reaps children — `docker compose down` hangs.
    init: true
    ports:
      - "${HEDDLED_PORT:-5005}:5005"
    environment:
      # Providers read these when Settings has no key stored.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      HEDDLED_KEEP_FULL_CONTEXT_DAYS: "${HEDDLED_KEEP_FULL_CONTEXT_DAYS:-90}"
      # In split mode the web container must not also tick triggers.
      HEDDLED_WEB_ONLY: "${HEDDLED_WEB_ONLY:-0}"
      # Where Jarvis's terminal lives. Empty, or unreachable, and the terminal
      # reports itself as not running rather than failing mid-command.
      HEDDLED_JARVIS_SANDBOX: "${HEDDLED_JARVIS_SANDBOX:-http://jarvis-sandbox:8080}"
    volumes:
      - ./agents:/app/agents
      - ./tools:/app/tools
      # Where agents given a workspace do their file work. Bind-mounted rather
      # than a volume so a file can be dropped in and the result picked up
      # without `docker cp` — the same reasoning as agents/ and tools/. Both
      # services get it: the worker runs the turns that touch it.
      - ./work:/app/work
      # Jarvis's own tree. Its agents, tools and notes live here, and `work/`
      # inside it is the one directory the sandbox container also sees.
      - ./jarvis:/app/jarvis
      - heddled-data:/app/data
      - heddled-var:/app/var
    restart: unless-stopped

  # Optional second process. Enable with `--profile split`, and set
  # HEDDLED_WEB_ONLY=1 so the web container serves HTTP only.
  worker:
    build: .
    image: heddled:latest
    init: true
    profiles: ["split"]
    command: ["heddled", "worker", "--concurrency", "4"]
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
    volumes:
      - ./agents:/app/agents
      - ./tools:/app/tools
      # Where agents given a workspace do their file work. Bind-mounted rather
      # than a volume so a file can be dropped in and the result picked up
      # without `docker cp` — the same reasoning as agents/ and tools/. Both
      # services get it: the worker runs the turns that touch it.
      - ./work:/app/work
      - ./jarvis:/app/jarvis
      - heddled-data:/app/data
      - heddled-var:/app/var
    restart: unless-stopped

  # Jarvis's terminal, and the reason its fences survive having one.
  #
  # A shell in the Heddled container would be able to read data/heddled.db —
  # every provider key and password hash on the instance — and edit
  # agents/*.yaml, which is where the approval gates live. So it runs here
  # instead: no Heddled source, no database, no environment, and one volume it
  # shares with the file browser. No published port either; it is reachable
  # only from this network, by name, which is how Heddled finds it.
  #
  # Started only with `--profile jarvis`, because Jarvis is an add-on nobody
  # gets by default:
  #
  #     docker compose --profile jarvis up -d --build
  #
  # Without it the Jarvis screen still works and the terminal simply says it
  # is not running.
  jarvis-sandbox:
    build: ./sandbox
    image: heddled-jarvis-sandbox:latest
    init: true
    profiles: ["jarvis"]
    volumes:
      - ./jarvis/work:/work
    restart: unless-stopped

volumes:
  heddled-data:
  heddled-var:
