name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the image ships; the others keep `requires-python = 3.10`
        # honest, and 3.14 exercises the stdlib zstd path instead of the package.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: The CLI works from a clean install
        run: |
          heddled init "$RUNNER_TEMP/scaffolded"
          cd "$RUNNER_TEMP/scaffolded"
          heddled agents
          heddled tool test echo --args '{"text":"hello"}'
          heddled chat assistant "hello there" --trace

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t heddled:ci .

      - name: A single container is the whole platform
        run: |
          # agents/ and tools/ are the operator's, not the repository's, so a
          # clean checkout has neither. The starter set is what a new install
          # copies in, which makes this the same first run a person gets.
          cp -r examples/starter/agents examples/starter/tools .

          docker run -d --init --name heddled-ci -p 5005:5005 \
            -v "$PWD/agents:/app/agents" -v "$PWD/tools:/app/tools" heddled:ci

          for i in $(seq 1 30); do
            if curl -sf localhost:5005/api/health >/dev/null; then break; fi
            sleep 1
          done

          # Health is deliberately open — it is what a monitor polls.
          curl -sf localhost:5005/api/health | tee /dev/stderr | grep -q '"worker_alive":true'

          # Everything else refuses until somebody claims the console, which is
          # the behaviour worth asserting before authenticating past it.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:5005/api/agents)" = 503

          PW="$(openssl rand -hex 16)"
          docker exec heddled-ci heddled user add ci --role admin --password "$PW"
          AUTH="Authorization: Bearer ci:$PW"

          # The console renders for a signed-in request, rather than bouncing
          # to /login — a bare `curl /` passes on that redirect and proves
          # nothing.
          curl -sf -H "$AUTH" localhost:5005/ | grep -q "<title>"

          # A full turn, end to end, inside the container.
          curl -sf -X POST localhost:5005/api/agents/support/messages \
            -H 'content-type: application/json' -H "$AUTH" \
            -d '{"text":"where is invoice F-2231?","sync":true}' \
            | tee /dev/stderr | grep -q '"status": *"completed"'

      - name: Logs on failure
        if: failure()
        run: docker logs heddled-ci || true

      - name: Stop
        if: always()
        run: docker rm -f heddled-ci || true

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compose file is valid in both profiles
        run: |
          docker compose config -q
          docker compose --profile split config -q
